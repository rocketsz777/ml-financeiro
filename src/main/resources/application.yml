server:
  port: 8080

spring:
  profiles:
    active: local

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

mercadolivre:
  client-id: ${MERCADOLIVRE_CLIENT_ID}
  client-secret: ${MERCADOLIVRE_CLIENT_SECRET}

app:
  data-dir: ./data