server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

mercadolivre:
  client-id: ${MERCADOLIVRE_CLIENT_ID}
  client-secret: ${MERCADOLIVRE_CLIENT_SECRET}
  redirect-uri: ${MERCADOLIVRE_REDIRECT_URI:https://rocket-imports-api.onrender.com/oauth/mercadolivre/callback}

shopee:
  partner-id: ${SHOPEE_PARTNER_ID}
  partner-key: ${SHOPEE_PARTNER_KEY}
  redirect-uri: ${SHOPEE_REDIRECT_URI:https://rocket-imports-api.onrender.com/shopee/callback}

app:
  data-dir: ./data